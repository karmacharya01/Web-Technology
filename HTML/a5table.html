<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table {
            background-color: blanchedalmond;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <table border="3px" cellspacing="5">
        <caption><b>Table Example</b></caption>
        <tr>
            <th>Table Head 1</th>
            <th>Table Head 2</th>
            <th>Table Head 3</th>
            <th>Table Head 4</th>
        </tr>

        <tr align="center">
            <td>Cell 1</td>
            <td colspan="2">Cell 2</td>
            <td>Cell 3</td>

        </tr>
        
        <tr align="center">
            <td rowspan="2">Cell 4</td>
            <td colspan="2" rowspan="2">Cell 5</td>
            <td>Cell 6</td>
        </tr>

        <tr align="center">
            <td rowspan="">Cell 7</td>
        </tr>
        
        <tr align="center">
            <td>Cell 8</td>
            <td colspan="2">Cell 9</td>
            <td>Cell 10</td>

        </tr>
    </table>
</body>

</html>
