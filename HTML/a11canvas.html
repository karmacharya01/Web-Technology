<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id=myCanvas width="300" height="200" style="border:2px solid #2914e6;">
    </canvas>

    <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d"); //Drawing Objects for canvas

        ctx.moveTo(0, 0); //Upper left corner co-ordinates(starting point of line
        ctx.lineTo(300, 200); //800,500 Ending point of line
        ctx.stroke();
    </script>

</body>

</html>
