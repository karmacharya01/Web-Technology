<!DOCTYPE html>
<html lang="en">

<head>
    <title>Form</title>
</head>

<body>
    <Form>
        <h3>Fill the following Form</h3>

        <label for="Name">Name:</label>
        <input type="text" name="FullName" id="Name" required><br><br>

        <label for="psw">Password:</label>
        <input type="password" name="password" id="psw"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="no">Phone Number:</label>
        <input type="tel" min="1000000000" max="9999999999" id="no" name="number"><br><br>

        <label for="sex">Sex:</label>
        <input type="radio" id="male" name="sex">
        <label for="male">Male</label>

        <input type="radio" id="female" name="sex">
        <label for="female">Female</label><br><br>

        <label for="country">Country:</label>
        <select id="country" name="Country">
            <option value="" selected disabled>Select an option</option>
            <option value="nepal">Nepal</option>
            <option value="india">India</option>
            <option value="china">china</option>
            <option value="pakistan">Pakistan</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message" rows="3" cols="27"></textarea><br><br>

        <input type="submit">
    </Form>

</body>

</html>
