<!DOCTYPE html>
<html>

<head>
  <title>CSS Gradient</title>
  <style>
    
    /* Linear Gradient */
    .linear {
      height: 50px;
      background: linear-gradient(red, yellow);
    }

    /* Radial Gradient */
    .radial {
      height: 50px;
      background: radial-gradient(blue, white);
    }
  </style>
</head>

<body>

  <h2>Linear Gradient</h2>
  <div class="linear"></div>

  <h2>Radial Gradient</h2>
  <div class="radial"></div>

</body>

</html>
