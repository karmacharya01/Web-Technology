<!DOCTYPE html>
<html>

<head>
    <style>
        .block {
            display: block;
            background: lightblue;
            margin: 5px;
        }

        .inline {
            display: inline;
            background: lightgreen;
        }

        .inline-block {
            display: inline-block;
            width: 100px;
            height: 50px;
            background: orange;
            margin: 5px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <div class="block">Block</div>

    <span class="inline">Inline</span>
    

    <div class="inline-block">Inline-block</div>
    

    <p class="none">This will not be shown</p>

</body>

</html>
