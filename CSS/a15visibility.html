<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .one{
            visibility: visible;
        }
        .two{
            visibility: hidden;
        }
        h3{
            z-index: 2;
            position: absolute;
        }
        h4{
            z-index: 3;
            position: absolute;
        }
    </style>
</head>
<body>
    <h1 class="one">Heading 1</h1>
    <h2 class="two">Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>z-index</h4>
</body>
</html>
