<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p.dotted {
            border-style: dotted;
        }

        p.dashed {
            border-style: dashed;
            border-width: 5px;
        }

        p.solid {
            border-style: solid;
            border-radius: 5px;
        }

        p.double {
            border-style: double;
            border-color: red;
        }

        p.groove {
            border-style: groove;
        }

    </style>
</head>

<body>
    <p class="dotted">A dotted border</p>
    <p class="dashed">A dashed border</p>
    <p class="solid">A solid border</p>
    <p class="double">A double border</p>
    <p class="groove">A groove border</p>
   
</body>

</html>
