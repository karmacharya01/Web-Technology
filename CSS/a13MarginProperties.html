<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            border: 2px solid black;
            margin: 30px;
            /* Space on all sides */
        }

        .box1 {
            margin-top: 40px;
        }

        .box2 {
            margin-right: 40px;
        }

        .box3 {
            margin-bottom: 40px;
        }

        .box4 {
            margin-left: 40px;
        }
    </style>
</head>

<body>

    <div class="box1">Margin Top</div>
    <div class="box2">Margin Right</div>
    <div class="box3">Margin Bottom</div>
    <div class="box4">Margin Left</div>

</body>

</html>
