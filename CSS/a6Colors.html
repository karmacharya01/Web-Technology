<!DOCTYPE html>
<html>

<head>
  <title>CSS Colors</title>
  <style>
    h1 {
      color: red;
      /* Text color */
    }

    p {
      background-color: yellow;
      /* Background color */
    }

    div {
      border: 3px solid blue;
      /* Border color */
      padding: 10px;
    }

    span {
      color: white;
      background-color: black;
    }
  </style>
</head>

<body>

  <h1>This is Heading</h1>

  <p>This is paragraph with background color</p>

  <div>This is div with border color</div>

  <span>This is span with text + background color</span>

</body>

</html>
