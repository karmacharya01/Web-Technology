<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Selectors</title>
    <style>
        /* Universal Selectors */
        *{
            text-decoration: underline;
        }
        /* Id Selectors */
        #header{
            background-color:violet;
        }
        /* Class Selectors */
        .head{
            font-size: 16px;
        }
        /* Attribute Selectors */
        [target]{
            color: red;
        }
        /* Id Selectors */
        [type="submit"]{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h4 id="header">Use of id Selector</h4>
    <h1 class="head">Use of class Selector</h1>
    <a href="text.html" target="_blank">Click this</a>
    <input type="submit">
</body>
</html>
